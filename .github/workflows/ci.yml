name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tree-sitter-cli
        run: npm install -g tree-sitter-cli

      - name: Test grammar
        working-directory: tree-sitter-quadrate
        run: |
          tree-sitter generate
          tree-sitter test

  surface:
    name: Language surface matches the compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the compiler
        uses: actions/checkout@v5
        with:
          repository: quadrate-language/quadrate
          path: .quadrate

      # The syntax definition is a hand-maintained copy of the compiler's builtin
      # and keyword tables, and nothing here can see those tables. Without this the
      # copy drifts silently: every removed stack shuffler plus `ctx` and `while`
      # survived here long after the compiler dropped them.
      - name: Compare against lib/qc/include/quadrate/qc/instructions.h
        run: |
          python3 .quadrate/tools/check_builtin_lists.py --extra syntax/quadrate.vim \
            tree-sitter-quadrate/grammar.js \
            tree-sitter-quadrate/queries/highlights.scm
